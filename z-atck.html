<!doctype html><meta charset="utf-8"><title>Zerion Origin B</title>Controlled cross-origin B
<script>
'use strict';
const victimOrigin=new URLSearchParams(location.search).get('victimOrigin');
if(!victimOrigin||new URL(victimOrigin).origin!==victimOrigin)throw Error('Invalid victim origin');
const parentSend=d=>parent.postMessage(d,victimOrigin);
function findProvider(){const list=[['zerionWallet.ethereum',window.zerionWallet?.ethereum],['zerionWallet',window.zerionWallet],['ethereum.isZerion',window.ethereum?.providers?.find(p=>p?.isZerion)],['ethereum',window.ethereum]];return list.find(([,p])=>p?.request)||['none',null]}
const [providerName,p]=findProvider(),hex=s=>'0x'+[...new TextEncoder().encode(s)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function run(type,account,chainId){
  if(!p)throw Error('Zerion provider absent in cross-origin iframe');
  if(type==='ACCOUNTS')return['eth_accounts',await p.request({method:'eth_accounts'})];
  if(type==='PERSONAL'){const message=`CROSS-ORIGIN TEST ONLY\nActual B: ${location.origin}\nVictim A: ${victimOrigin}\nReject this request.`;return['personal_sign',await p.request({method:'personal_sign',params:[hex(message),account]})]}
  const data={types:{EIP712Domain:[{name:'name',type:'string'},{name:'version',type:'string'},{name:'chainId',type:'uint256'},{name:'verifyingContract',type:'address'}],Test:[{name:'statement',type:'string'}]},primaryType:'Test',domain:{name:'Cross-Origin Test',version:'1',chainId:parseInt(chainId,16),verifyingContract:account},message:{statement:`Actual B ${location.origin}; claimed account from A; reject.`}};
  return['eth_signTypedData_v4',await p.request({method:'eth_signTypedData_v4',params:[account,JSON.stringify(data)]})];
}
addEventListener('message',async e=>{if(e.source!==parent||e.origin!==victimOrigin)return;const {type,account,chainId}=e.data||{};let test=type;try{const r=await run(type,account,chainId);parentSend({type:'RESULT',test:r[0],value:r[1],actualOrigin:location.origin,provider:providerName})}catch(error){parentSend({type:'RESULT',test:type==='PERSONAL'?'personal_sign':type==='TYPED'?'eth_signTypedData_v4':'eth_accounts',error:{code:error?.code??null,message:error?.message||String(error)},actualOrigin:location.origin,provider:providerName})}});
parentSend({type:'READY',actualOrigin:location.origin,victimOrigin,isSubframe:self!==top,provider:providerName});
</script>
