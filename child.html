<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core strict validator Origin B</title>
<body style="font:14px/1.4 system-ui;margin:12px">
<strong>Controlled Origin B</strong>
<pre id="log"></pre>
<script>
(() => {
  'use strict';

  const query = new URLSearchParams(location.search);
  const topOrigin = query.get('topOrigin');
  const session = query.get('session');
  const output = document.getElementById('log');

  if (!topOrigin || !session) throw new Error('Missing controlled test parameters');
  if (new URL(topOrigin).origin !== topOrigin) throw new Error('Invalid topOrigin');

  function report(event, details = {}) {
    const message = {
      lab: 'core-strict',
      session,
      event,
      actualChildOrigin: location.origin,
      isSubframe: self !== top,
      time: new Date().toISOString(),
      ...details
    };
    output.textContent += JSON.stringify(message) + '\n';
    parent.postMessage(message, topOrigin);
  }

  function nativePost(id, claimedOrigin) {
    const message = JSON.stringify({
      method: 'provider_request',
      payload: JSON.stringify({
        id,
        origin: claimedOrigin,
        request: { method: 'wallet_getPermissions', params: [] }
      })
    });

    if (window.ReactNativeWebView?.postMessage) {
      window.ReactNativeWebView.postMessage(message);
      return 'window.ReactNativeWebView';
    }
    const ios = window.webkit?.messageHandlers?.ReactNativeWebView;
    if (ios?.postMessage) {
      ios.postMessage(message);
      return 'window.webkit.messageHandlers.ReactNativeWebView';
    }
    throw new Error('Native bridge is not exposed to Origin B');
  }

  addEventListener('message', event => {
    if (event.source !== parent || event.origin !== topOrigin) return;
    const data = event.data;
    if (!data || data.lab !== 'core-strict' || data.session !== session) return;
    if (data.command !== 'RUN_DIFFERENTIAL') return;

    try {
      const negativeBridge = nativePost(data.negativeId, location.origin);
      report('NEGATIVE_CONTROL_POSTED', {
        id: data.negativeId,
        claimedOrigin: location.origin,
        bridge: negativeBridge
      });

      setTimeout(() => {
        try {
          const positiveBridge = nativePost(data.positiveId, data.topOrigin);
          report('IMPERSONATION_REQUEST_POSTED', {
            id: data.positiveId,
            claimedOrigin: data.topOrigin,
            bridge: positiveBridge
          });
        } catch (error) {
          report('CHILD_ERROR', { message: String(error) });
        }
      }, 500);
    } catch (error) {
      report('CHILD_ERROR', { message: String(error) });
    }
  });

  report('CHILD_READY', {
    androidBridge: Boolean(window.ReactNativeWebView?.postMessage),
    iosRawBridge: Boolean(window.webkit?.messageHandlers?.ReactNativeWebView)
  });
})();
</script>
</body>
</html>
