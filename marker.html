<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlled marker</title>
<body style="font:18px system-ui;padding:24px">
  <h2>Controlled Origin-B marker</h2>
  <p>If Core opened this as a native tab, the cross-origin child reached the native <code>window_open</code> handler.</p>
  <p id="origin"></p>
  <script>document.getElementById('origin').textContent='Actual origin: '+location.origin;</script>
</body>
